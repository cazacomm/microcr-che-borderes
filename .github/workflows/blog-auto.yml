name: Blog auto

on:
  schedule:
    # Tous les lundis à 9h00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      topic:
        description: "Numéro de sujet à forcer (optionnel, voir BLOG_WORKFLOW.md)"
        required: false
        type: string
      dry_run:
        description: "Simuler sans rien écrire ni publier"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: blog-auto
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai

      - name: Generate article
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.topic }}" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          python scripts/generate-article.py $ARGS
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0)  echo "Article généré." ;;
            78) echo "Aucun nouveau sujet à traiter : rien à publier." ;;
            *)  echo "::error::Échec de la génération (code $CODE)." ; exit "$CODE" ;;
          esac

      - name: Commit & push
        if: steps.generate.outputs.code == '0' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucune modification à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(blog): article auto du $(date -u +%d/%m/%Y)"
          git push
